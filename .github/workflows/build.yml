name: Build and deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
env:
  VITE_SUPABASE_URL: https://ixuqdlzyfktqxffsckem.supabase.co
  VITE_SUPABASE_ANON_KEY: sb_publishable_iIW9rArQ5snN4ZS28Vi8Yw_4HU9J_j5
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Arrange files
        run: |
          mkdir -p src public assets android-signing
          for f in main.js styles.css supa.js; do if [ -f "$f" ]; then mv "$f" src/; fi; done
          for f in logo.jpg icon.png; do if [ -f "$f" ]; then mv "$f" public/; fi; done
          for f in icon-only.png icon-foreground.png icon-background.png splash.png splash-dark.png; do if [ -f "$f" ]; then mv "$f" assets/; fi; done
          if [ -f debug.keystore ]; then mv debug.keystore android-signing/; fi
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Arrange files
        run: |
          mkdir -p src public assets android-signing
          for f in main.js styles.css supa.js; do if [ -f "$f" ]; then mv "$f" src/; fi; done
          for f in logo.jpg icon.png; do if [ -f "$f" ]; then mv "$f" public/; fi; done
          for f in icon-only.png icon-foreground.png icon-background.png splash.png splash-dark.png; do if [ -f "$f" ]; then mv "$f" assets/; fi; done
          if [ -f debug.keystore ]; then mv debug.keystore android-signing/; fi
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npm run build
      - name: Create Android project
        run: |
          npx cap add android
          npx @capacitor/assets generate --android
          npx cap sync android
      - name: Fixed signing key
        run: mkdir -p ~/.android && cp android-signing/debug.keystore ~/.android/debug.keystore
      - name: Build APK
        working-directory: android
        run: |
          sed -i 's/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName "1.0"/versionName "1.0.${{ github.run_number }}"/' app/build.gradle
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk ModernLink-1.0.${{ github.run_number }}.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: android-1.0.${{ github.run_number }}
          name: Android 1.0.${{ github.run_number }}
          files: ModernLink-*.apk
